name: PR Preview (deploy)

# Deploys the PR to a throwaway Cloudflare account via `wrangler deploy --temporary`.
# Runs in the fork-safe `pull_request` context: read-only token, no secrets.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy temporary preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to temporary Cloudflare account
        id: deploy
        run: |
          set -euo pipefail
          # The shared command captures Wrangler output before it reaches CI logs.
          # It emits only sanitized JSON and never writes a claim URL or token.
          node --experimental-strip-types scripts/deploy-preview.ts --target temporary

      - name: Write preview metadata artifact
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p preview-meta
          printf '%s\n' "$PR_NUMBER" > preview-meta/pr_number.txt
          printf '%s\n' "$PR_HEAD_SHA" > preview-meta/pr_head_sha.txt
          printf '%s\n' "$PREVIEW_URL" > preview-meta/preview_url.txt
          printf '%s\n' "$RUN_URL" > preview-meta/run_url.txt

      - name: Upload preview metadata
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview-meta
          path: preview-meta/
          retention-days: 1
