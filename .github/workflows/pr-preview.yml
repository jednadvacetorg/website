name: PR Preview (deploy)

# Deploys the PR to a throwaway Cloudflare account via `wrangler deploy --temporary`.
# Runs in the fork-safe `pull_request` context: read-only token, no secrets.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy temporary preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build preview profile
        env:
          PREVIEW_DEPLOY: "1"
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build:cloudflare

      - name: Validate isolated preview bindings
        run: |
          node --experimental-strip-types --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises'
          import { validatePreviewConfiguration } from './scripts/validate-preview-config.ts'
          validatePreviewConfiguration(JSON.parse(await readFile('.output/server/wrangler.json', 'utf8')))
          JS

      # Wrangler's supported temporary-account flow can provision the generated
      # bindings, but it does not expose credentials to NuxtHub's native D1 migration
      # CLI. Keep this pre-existing browser preview working while the full refresh
      # lifecycle remains unavailable in this temporary browser preview.
      - name: Deploy temporary browser preview
        id: deploy
        run: |
          set -euo pipefail
          raw_log="$(mktemp)"
          trap 'rm -f "$raw_log"' EXIT
          npx wrangler deploy --temporary --keep-vars --config .output/server/wrangler.json >"$raw_log" 2>&1
          preview_url="$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev[^[:space:]]*' "$raw_log" | head -n1 || true)"
          if [ -z "$preview_url" ]; then
            echo '::error::Temporary deployment did not provide a public Worker URL.'
            exit 1
          fi
          printf 'preview_url=%s\n' "$preview_url" >> "$GITHUB_OUTPUT"

      - name: Write preview metadata artifact
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p preview-meta
          printf '%s\n' "$PR_NUMBER" > preview-meta/pr_number.txt
          printf '%s\n' "$PR_HEAD_SHA" > preview-meta/pr_head_sha.txt
          printf '%s\n' "$PREVIEW_URL" > preview-meta/preview_url.txt
          printf '%s\n' "$RUN_URL" > preview-meta/run_url.txt

      - name: Upload preview metadata
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview-meta
          path: preview-meta/
          retention-days: 1
